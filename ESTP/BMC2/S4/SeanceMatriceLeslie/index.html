<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TP Matrice de population</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #dbe3f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero,
    .content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .hero {
      padding: 24px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid var(--primary);
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .button-primary {
      background: var(--primary);
      color: #fff;
    }

    .button-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .button-secondary {
      background: #fff;
      color: var(--primary);
    }

    .button-secondary:hover {
      background: #eff6ff;
    }

    .content {
      padding: 24px;
    }

    .content h2 {
      margin-top: 0;
      margin-bottom: 16px;
    }

    #markdown-content {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      overflow-x: auto;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>TP : Matrice de population</h1>
      <p class="subtitle">
        Cette page permet d'afficher le sujet en Markdown et de télécharger le script Python préparé.
      </p>
      <div class="actions">
        <a class="button button-primary" href="TP_matrice_population.py" download>
          Télécharger le script Python
        </a>
        <a class="button button-secondary" href="TP_matrice_population.md" target="_blank" rel="noopener noreferrer">
          Ouvrir le fichier Markdown
        </a>
      </div>
    </section>

    <section class="content">
      <h2>Sujet</h2>
      <pre id="markdown-content">Chargement du sujet...</pre>
    </section>
  </main>

  <script>
    const markdownPath = "TP_matrice_population.md";
    const markdownContainer = document.getElementById("markdown-content");

    fetch(markdownPath)
      .then((response) => {
        if (!response.ok) {
          throw new Error("Impossible de charger le sujet.");
        }
        return response.text();
      })
      .then((text) => {
        markdownContainer.textContent = text;
      })
      .catch((error) => {
        markdownContainer.textContent = error.message;
        markdownContainer.classList.add("error");
      });
  </script>
</body>
</html>
